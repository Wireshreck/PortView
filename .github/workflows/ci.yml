name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check syntax
        run: npm run lint

      - name: Run tests
        run: npm test

  smoke:
    name: Server starts and answers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start the server
        run: node server.js &
        shell: bash

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6969/api/state > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start in time"
          exit 1

      - name: The page and the API both answer
        run: |
          curl -fsS http://127.0.0.1:6969/ | grep -q "PortView"
          curl -fsS http://127.0.0.1:6969/api/state | grep -q '"status"'
