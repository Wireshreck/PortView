name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check syntax
        run: npm run lint

      - name: Check startup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/install-startup.ps1', 'scripts/uninstall-startup.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in $errors) {
              Write-Error "$file`: $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Run tests
        run: npm test

  smoke:
    name: Server starts and answers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Starts the server on a spare port, checks the page and the API, then
      # stops it again. Plain Node, so it behaves the same on every platform.
      - name: Start the server, check it answers, stop it
        run: node scripts/smoke.js
