name: Bug report

description: Something in PortView is wrong or unexpected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not include personal information** — no hostnames, IP
        addresses, usernames or full paths. PortView reads all of those from
        your machine, so a report about a wrong port name is much more useful
        with them removed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
      placeholder: The table listed port 8080 as "Web App" but the process behind it is ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can someone else see the same thing?
      placeholder: |
        1. Start PortView
        2. Press Scan
        3. Open the Dev Servers section
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v20.11.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: The Activity panel in PortView is the most useful thing to paste here.
      render: shell
